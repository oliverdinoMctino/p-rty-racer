<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low Poly Racer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #14213d, #1b4965);
    }

    .screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .panel {
      width: min(440px, 95%);
      padding: 28px;
      border-radius: 18px;
      background: #ffffff18;
      box-shadow: 0 8px 30px #0008;
      backdrop-filter: blur(8px);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input, select {
      background: white;
      color: #152238;
    }

    button {
      background: #ffb703;
      color: #152238;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffd166;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #message {
      min-height: 25px;
      color: #ffe08a;
    }

    #lobby, #raceScreen, #finishScreen {
      display: none;
    }

    #partyCode {
      color: #ffb703;
      font-size: 28px;
      letter-spacing: 4px;
    }

    ul {
      padding: 0;
    }

    li {
      list-style: none;
      padding: 8px;
      margin: 5px 0;
      border-radius: 7px;
      background: #ffffff15;
    }

    #raceScreen {
      position: fixed;
      inset: 0;
      background: #87ceeb;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      min-width: 220px;
      padding: 14px;
      border-radius: 12px;
      background: #102033dd;
      box-shadow: 0 4px 15px #0008;
    }

    #hud h2 {
      margin-bottom: 8px;
      font-size: 18px;
    }

    #hud p {
      margin: 5px 0;
    }

    #countdown {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(70px, 18vw, 180px);
      font-weight: bold;
      color: #ffb703;
      text-shadow: 5px 5px 0 #152238;
      pointer-events: none;
    }

    #finishScreen {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: #102033e8;
      place-items: center;
      padding: 20px;
    }

    .finish-box {
      width: min(420px, 95%);
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      background: #1f4968;
      box-shadow: 0 10px 30px #0009;
    }

    .finish-box h1 {
      color: #ffb703;
      font-size: 42px;
    }

    .help {
      color: #d6efff;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <!-- MAIN MENU -->
  <main class="screen" id="menuScreen">
    <section class="panel" id="menu">
      <h1>🏎️ Low Poly Racer</h1>

      <input id="nameInput" maxlength="12" placeholder="Choose a nickname" />
      <button id="createButton">Create Party</button>

      <hr />

      <input
        id="codeInput"
        maxlength="6"
        placeholder="Enter party code"
        style="text-transform: uppercase;"
      />

      <button id="joinButton">Join Party</button>
      <p id="message"></p>
    </section>

    <!-- LOBBY -->
    <section class="panel" id="lobby">
      <h2>Race Lobby</h2>

      <p>Party code: <strong id="partyCode"></strong></p>

      <label for="trackSelect"><strong>Choose a track</strong></label>
      <select id="trackSelect">
        <option value="monaco">Monaco — Monte Carlo</option>
        <option value="suzuka">Suzuka — Japan</option>
        <option value="cota">Circuit of the Americas — USA</option>
        <option value="interlagos">Interlagos — Brazil</option>
        <option value="monza">Monza — Italy</option>
        <option value="silverstone">Silverstone — Great Britain</option>
      </select>

      <label for="lapsSelect"><strong>Number of laps</strong></label>
      <select id="lapsSelect">
        <option value="1">1 lap</option>
        <option value="2">2 laps</option>
        <option value="3" selected>3 laps</option>
        <option value="4">4 laps</option>
        <option value="5">5 laps</option>
        <option value="6">6 laps</option>
        <option value="7">7 laps</option>
        <option value="8">8 laps</option>
        <option value="9">9 laps</option>
        <option value="10">10 laps</option>
      </select>

      <button id="startButton">Start Race</button>

      <p id="hostMessage"></p>

      <h3>Players</h3>
      <ul id="playerList"></ul>

      <p class="help">
        The party creator chooses the track and number of laps.
      </p>
    </section>
  </main>

  <!-- RACE -->
  <section id="raceScreen">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <h2 id="trackTitle">Race</h2>
      <p id="lapText">Lap: 1 / 3</p>
      <p id="speedText">Speed: 0</p>
      <p class="help">Drive: WASD or arrow keys</p>
      <p class="help">Stay on the road!</p>
    </div>

    <div id="countdown"></div>
  </section>

  <!-- FINISH SCREEN -->
  <section id="finishScreen">
    <div class="finish-box">
      <h1>🏁 FINISH!</h1>
      <h2 id="finishMessage">Great race!</h2>
      <p id="finishTime"></p>
      <button onclick="location.reload()">Return to Menu</button>
    </div>
  </section>

    function makePartyCode() {
      const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
      const numbers = "23456789";
      let code = "";

      for (let i = 0; i < 4; i++) {
        code += letters[Math.floor(Math.random() * letters.length)];
      }

      for (let i = 0; i < 2; i++) {
        code += numbers[Math.floor(Math.random() * numbers.length)];
      }

      return code;
    }

function getPlayerName() {
  const name = nameInput.value.trim();

  return name;
}

    async function createParty() {
      const playerName = getPlayerName();
      if (!playerName) return;

      message.textContent = "Creating party...";

      const code = makePartyCode();

      const { error: partyError } = await supabaseClient
        .from("parties")
        .insert({
          code: code,
          host_id: playerId,
          status: "lobby",
          track: "monaco",
          laps: 3
        });

      if (partyError) {
        message.textContent = "That code was busy. Click Create Party again.";
        return;
      }

      const { error: playerError } = await supabaseClient
        .from("players")
        .insert({
          party_code: code,
          player_name: playerName
        });

      if (playerError) {
        message.textContent = "Party made, but you could not join.";
        return;
      }

      openLobby({
        code: code,
        host_id: playerId,
        status: "lobby",
        track: "monaco",
        laps: 3
      });
    }

    async function joinParty() {
      const playerName = getPlayerName();
      if (!playerName) return;

      const code = codeInput.value.trim().toUpperCase();

      if (code.length !== 6) {
        message.textContent = "Party codes have 6 characters.";
        return;
      }

      message.textContent = "Looking for party...";

      const { data: party, error } = await supabaseClient
        .from("parties")
        .select("*")
        .eq("code", code)
        .maybeSingle();

      if (error || !party) {
        message.textContent = "Party not found. Check the code.";
        return;
      }

      if (party.status === "racing") {
        message.textContent = "That race has already started.";
        return;
      }

      const { error: joinError } = await supabaseClient
        .from("players")
        .insert({
          party_code: code,
          player_name: playerName
        });

      if (joinError) {
        message.textContent = "Could not join the party.";
        return;
      }

      openLobby(party);
    }

    function openLobby(party) {
      currentParty = party;
      currentPartyCode = party.code;

      menu.style.display = "none";
      lobby.style.display = "block";

      partyCodeText.textContent = party.code;
      trackSelect.value = party.track || "monaco";
      lapsSelect.value = party.laps || 3;

      const isHost = party.host_id === playerId;

      trackSelect.disabled = !isHost;
      lapsSelect.disabled = !isHost;
      startButton.style.display = isHost ? "block" : "none";

      hostMessage.textContent = isHost
        ? "You are the host. Choose the track, laps, then start!"
        : "Waiting for the host to start the race...";

      loadPlayers();
      listenForPlayers();
      listenForRaceStart();
    }

    async function loadPlayers() {
      const { data: players, error } = await supabaseClient
        .from("players")
        .select("player_name")
        .eq("party_code", currentPartyCode)
        .order("joined_at");

      if (error) return;

      playerList.innerHTML = "";

      for (const player of players) {
        const item = document.createElement("li");
        item.textContent = "🏁 " + player.player_name;
        playerList.appendChild(item);
      }
    }

    function listenForPlayers() {
      supabaseClient
        .channel("players-" + currentPartyCode)
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "players",
            filter: "party_code=eq." + currentPartyCode
          },
          loadPlayers
        )
        .subscribe();
    }

    async function startRace() {
      if (currentParty.host_id !== playerId) return;

      startButton.disabled = true;
      startButton.textContent = "Starting...";

      const selectedTrack = trackSelect.value;
      const selectedLaps = Number(lapsSelect.value);

      // Race starts 4 seconds from now for the countdown.
      const startTime = new Date(Date.now() + 4000).toISOString();

      const { error } = await supabaseClient
        .from("parties")
        .update({
          status: "racing",
          track: selectedTrack,
          laps: selectedLaps,
          race_started_at: startTime
        })
        .eq("code", currentPartyCode)
        .eq("host_id", playerId);

      if (error) {
        hostMessage.textContent = "Could not start. Try again.";
        startButton.disabled = false;
        startButton.textContent = "Start Race";
      }
    }

    function listenForRaceStart() {
      supabaseClient
        .channel("party-" + currentPartyCode)
        .on(
          "postgres_changes",
          {
            event: "UPDATE",
            schema: "public",
            table: "parties",
            filter: "code=eq." + currentPartyCode
          },
          (change) => {
            const party = change.new;

            if (party.status === "racing" && !gameStarted) {
              openRace(party.track, party.laps, party.race_started_at);
            }
          }
        )
        .subscribe();
    }

// Makes a number from a player's browser ID.
// It gives players slightly different starting positions.
function getSpawnOffset() {
  let number = 0;

  for (let i = 0; i < playerId.length; i++) {
    number += playerId.charCodeAt(i);
  }

  return (number % 5) * 2;
}

async function joinOnlineRace() {
  // Move each car slightly behind the starting line.
  const spawnOffset = getSpawnOffset();

  carState.x -= Math.sin(carState.angle) * spawnOffset;
  carState.z -= Math.cos(carState.angle) * spawnOffset;

  updateCarMesh();

  // Add your car, or update it if it already exists.
  const { error } = await supabaseClient
    .from("race_cars")
    .upsert(
      {
        party_code: currentPartyCode,
        player_id: playerId,
        player_name: currentPlayerName || "Racer",
        car_x: carState.x,
        car_z: carState.z,
        car_angle: carState.angle,
        updated_at: new Date().toISOString()
      },
      {
        onConflict: "party_code,player_id"
      }
    );

  if (error) {
    console.log("Could not add online car:", error);
  }

  // Load cars which were already added by friends.
  const { data: cars, error: loadError } = await supabaseClient
    .from("race_cars")
    .select("*")
    .eq("party_code", currentPartyCode);

  if (!loadError && cars) {
    for (const onlineCar of cars) {
      if (onlineCar.player_id !== playerId) {
        addOrMoveRemoteCar(onlineCar);
      }
    }
  }
}

function listenForRemoteCars() {
  supabaseClient
    .channel("race-cars-" + currentPartyCode)
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "race_cars",
        filter: "party_code=eq." + currentPartyCode
      },
      (change) => {
        const onlineCar = change.new;

        // Do not create a second version of your own car.
        if (!onlineCar || onlineCar.player_id === playerId) {
          return;
        }

        addOrMoveRemoteCar(onlineCar);
      }
    )
    .subscribe();
}

function makeRemoteCar(playerName) {
  const group = new THREE.Group();

  // Blue body, so friends' cars look different from your red car.
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2.2, 0.65, 4),
    new THREE.MeshStandardMaterial({
      color: 0x247bff,
      roughness: 0.6
    })
  );

  body.position.y = 0.8;
  group.add(body);

  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(1.55, 0.55, 1.85),
    new THREE.MeshStandardMaterial({
      color: 0x202a38,
      roughness: 0.3
    })
  );

  roof.position.set(0, 1.35, -0.2);
  group.add(roof);

  const wheelMaterial = new THREE.MeshStandardMaterial({
    color: 0x151515
  });

  const wheelPositions = [
    [-1.12, 0.45, -1.35],
    [1.12, 0.45, -1.35],
    [-1.12, 0.45, 1.35],
    [1.12, 0.45, 1.35]
  ];

  for (const position of wheelPositions) {
    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.45, 0.45, 0.35, 8),
      wheelMaterial
    );

    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(position[0], position[1], position[2]);
    group.add(wheel);
  }

  // A name label above the friend's car.
  const label = makeNameLabel(playerName);
  label.position.set(0, 3.2, 0);
  group.add(label);

  scene.add(group);

  return group;
}

function makeNameLabel(name) {
  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 64;

  const context = canvas.getContext("2d");

  context.fillStyle = "#102033";
  context.fillRect(0, 0, 256, 64);

  context.fillStyle = "white";
  context.font = "bold 30px Arial";
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillText(name, 128, 32);

  const texture = new THREE.CanvasTexture(canvas);

  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({
      map: texture,
      transparent: true
    })
  );

  sprite.scale.set(5, 1.25, 1);

  return sprite;
}

function addOrMoveRemoteCar(onlineCar) {
  let friendCar = remoteCars.get(onlineCar.player_id);

  if (!friendCar) {
    friendCar = makeRemoteCar(onlineCar.player_name);
    remoteCars.set(onlineCar.player_id, friendCar);
  }

  // Save the target position. The car will glide toward it.
  friendCar.userData.targetX = onlineCar.car_x;
  friendCar.userData.targetZ = onlineCar.car_z;
  friendCar.userData.targetAngle = onlineCar.car_angle;
}

async function sendCarPosition() {
  if (!currentPartyCode || raceFinished) {
    return;
  }

  const { error } = await supabaseClient
    .from("race_cars")
    .update({
      car_x: carState.x,
      car_z: carState.z,
      car_angle: carState.angle,
      updated_at: new Date().toISOString()
    })
    .eq("party_code", currentPartyCode)
    .eq("player_id", playerId);

  if (error) {
    console.log("Could not send car position:", error);
  }
}

function moveRemoteCars() {
  for (const friendCar of remoteCars.values()) {
    const targetX = friendCar.userData.targetX;
    const targetZ = friendCar.userData.targetZ;
    const targetAngle = friendCar.userData.targetAngle;

    if (targetX === undefined) {
      continue;
    }

    // Smooths the movement instead of making it jump.
    friendCar.position.x += (targetX - friendCar.position.x) * 0.18;
    friendCar.position.z += (targetZ - friendCar.position.z) * 0.18;

    friendCar.rotation.y = targetAngle;
  }
}

    function makeCar() {
      car = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 0.65, 4),
        new THREE.MeshStandardMaterial({
          color: 0xff3030,
          roughness: 0.6
        })
      );

      body.position.y = 0.8;
      car.add(body);

      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(1.55, 0.55, 1.85),
        new THREE.MeshStandardMaterial({
          color: 0x202a38,
          roughness: 0.3
        })
      );

      roof.position.set(0, 1.35, -0.2);
      car.add(roof);

      const wheelMaterial = new THREE.MeshStandardMaterial({
        color: 0x151515
      });

      const wheelPositions = [
        [-1.12, 0.45, -1.35],
        [1.12, 0.45, -1.35],
        [-1.12, 0.45, 1.35],
        [1.12, 0.45, 1.35]
      ];

      for (const position of wheelPositions) {
        const wheel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.45, 0.45, 0.35, 8),
          wheelMaterial
        );

        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(position[0], position[1], position[2]);
        car.add(wheel);
      }

      scene.add(car);

      carShadow = new THREE.Mesh(
        new THREE.CircleGeometry(2.3, 16),
        new THREE.MeshBasicMaterial({
          color: 0x000000,
          transparent: true,
          opacity: 0.22
        })
      );

      carShadow.rotation.x = -Math.PI / 2;
      carShadow.position.y = 0.03;
      scene.add(carShadow);
    }

    function placeCarAtStart() {
      const first = activeTrack.points[0];
      const second = activeTrack.points[1];

      carState.x = first[0];
      carState.z = first[1];

      // Point car toward checkpoint 1.
      carState.angle = Math.atan2(
        second[0] - first[0],
        second[1] - first[1]
      );

      carState.speed = 0;
      carState.lap = 1;
      carState.nextCheckpoint = 1;

      updateCarMesh();
    }

    // =====================================
    // ROAD, WALLS, TREES
    // =====================================
    function makeRoad(points) {
      const roadWidth = ROAD_HALF_WIDTH;
      const vertices = [];
      const indices = [];

      for (let i = 0; i < points.length; i++) {
        const before = points[(i - 1 + points.length) % points.length];
        const after = points[(i + 1) % points.length];

        const dx = after[0] - before[0];
        const dz = after[1] - before[1];
        const length = Math.sqrt(dx * dx + dz * dz);

        const sideX = -dz / length;
        const sideZ = dx / length;

        vertices.push(
          points[i][0] + sideX * roadWidth, 0.15, points[i][1] + sideZ * roadWidth
        );

        vertices.push(
          points[i][0] - sideX * roadWidth, 0.15, points[i][1] - sideZ * roadWidth
        );
      }

      for (let i = 0; i < points.length; i++) {
        const next = (i + 1) % points.length;

        indices.push(i * 2, i * 2 + 1, next * 2);
        indices.push(i * 2 + 1, next * 2 + 1, next * 2);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(vertices, 3)
      );

      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const road = new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({
          color: 0x30343b,
          roughness: 0.95
        })
      );

      scene.add(road);

      // Build simple barrier blocks along the outside of the road.
      for (let i = 0; i < points.length; i++) {
        const before = points[(i - 1 + points.length) % points.length];
        const after = points[(i + 1) % points.length];

        const dx = after[0] - before[0];
        const dz = after[1] - before[1];
        const length = Math.sqrt(dx * dx + dz * dz);

        const sideX = -dz / length;
        const sideZ = dx / length;

        for (const side of [-1, 1]) {
          const barrier = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 1.1, 1.2),
            new THREE.MeshStandardMaterial({
              color: i % 2 === 0 ? 0xffffff : 0xe63946
            })
          );

          barrier.position.set(
            points[i][0] + sideX * (ROAD_HALF_WIDTH + 0.8) * side,
            0.65,
            points[i][1] + sideZ * (ROAD_HALF_WIDTH + 0.8) * side
          );

          scene.add(barrier);
        }
      }

      // Finish line
      const start = points[0];
      const next = points[1];

      const direction = Math.atan2(
        next[0] - start[0],
        next[1] - start[1]
      );

      const finishLine = new THREE.Mesh(
        new THREE.BoxGeometry(ROAD_HALF_WIDTH * 2, 0.08, 1.1),
        new THREE.MeshStandardMaterial({ color: 0xffffff })
      );

      finishLine.position.set(start[0], 0.28, start[1]);
      finishLine.rotation.y = direction;
      scene.add(finishLine);
    }

    function makeTrees() {
      for (let i = 0; i < 45; i++) {
        const x = Math.random() * 130 - 65;
        const z = Math.random() * 130 - 65;

        // Do not put trees too close to the road.
        if (distanceToTrack(x, z) < ROAD_HALF_WIDTH + 4) {
          continue;
        }

        const tree = new THREE.Group();

        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.4, 0.65, 3, 5),
          new THREE.MeshStandardMaterial({ color: 0x6e4425 })
        );

        trunk.position.y = 1.5;

        const leaves = new THREE.Mesh(
          new THREE.ConeGeometry(2.2, 6, 5),
          new THREE.MeshStandardMaterial({ color: 0x176d35 })
        );

        leaves.position.y = 5;

        tree.add(trunk);
        tree.add(leaves);
        tree.position.set(x, 0, z);

        scene.add(tree);
      }
    }

    // =====================================
    // CAR CONTROLS
    // =====================================
    function keyDown(event) {
      keys[event.key.toLowerCase()] = true;

      if ([
        "arrowup",
        "arrowdown",
        "arrowleft",
        "arrowright"
      ].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
    }

    function keyUp(event) {
      keys[event.key.toLowerCase()] = false;
    }

    function updateCar(delta) {
      if (raceFinished) return;

      const now = Date.now();

      // Do not move before GO!
      if (now < raceStartTime) return;

      const forward = keys["w"] || keys["arrowup"];
      const backward = keys["s"] || keys["arrowdown"];
      const left = keys["a"] || keys["arrowleft"];
      const right = keys["d"] || keys["arrowright"];

      if (forward) {
        carState.speed += ACCELERATION * delta;
      }

      if (backward) {
        carState.speed -= BRAKE_POWER * delta;
      }

      // Natural slowing down when no key is held.
      if (!forward && !backward) {
        carState.speed *= Math.pow(0.92, delta * 60);
      }

      carState.speed = Math.max(-MAX_SPEED / 2, Math.min(MAX_SPEED, carState.speed));

      // Steering works better while moving.
      const turningAmount = TURN_SPEED * delta * (carState.speed / MAX_SPEED);

      if (left) {
        carState.angle += turningAmount;
      }

      if (right) {
        carState.angle -= turningAmount;
      }

      const oldX = carState.x;
      const oldZ = carState.z;

      carState.x += Math.sin(carState.angle) * carState.speed * delta;
      carState.z += Math.cos(carState.angle) * carState.speed * delta;

      // If the car goes too far away from the track,
      // move it back and slow it down.
      const roadDistance = distanceToTrack(carState.x, carState.z);

      if (roadDistance > ROAD_HALF_WIDTH) {
        carState.speed *= 0.82;

        const closest = closestPointOnTrack(carState.x, carState.z);
        const pullBack = 0.08;

        carState.x += (closest.x - carState.x) * pullBack;
        carState.z += (closest.z - carState.z) * pullBack;
      }

      // Stops strange giant jumps.
      if (Math.abs(carState.x - oldX) > 4 || Math.abs(carState.z - oldZ) > 4) {
        carState.x = oldX;
        carState.z = oldZ;
      }

      checkCheckpoint();
      updateCarMesh();
      updateCamera();
    }

    function updateCarMesh() {
      car.position.set(carState.x, 0, carState.z);
      car.rotation.y = carState.angle;

      carShadow.position.set(carState.x, 0.035, carState.z);
      carShadow.rotation.z = -carState.angle;
    }

    function updateCamera() {
      const behindX = carState.x - Math.sin(carState.angle) * 16;
      const behindZ = carState.z - Math.cos(carState.angle) * 16;

      const targetPosition = new THREE.Vector3(
        behindX,
        15,
        behindZ
      );

      camera.position.lerp(targetPosition, 0.08);

      camera.lookAt(
        carState.x + Math.sin(carState.angle) * 7,
        0,
        carState.z + Math.cos(carState.angle) * 7
      );
    }

    // =====================================
    // CHECKPOINTS AND LAPS
    // =====================================
    function checkCheckpoint() {
      const checkpoint = activeTrack.points[carState.nextCheckpoint];
      const dx = carState.x - checkpoint[0];
      const dz = carState.z - checkpoint[1];
      const distance = Math.sqrt(dx * dx + dz * dz);

      // The car must get close enough to the next point.
      if (distance < 5) {
        carState.nextCheckpoint++;

        if (carState.nextCheckpoint >= activeTrack.points.length) {
          carState.nextCheckpoint = 0;
        }

        // Reaching the start after every checkpoint means a lap is done.
        if (carState.nextCheckpoint === 1) {
          carState.lap++;

          if (carState.lap > activeLaps) {
            finishRace();
          }
        }
      }
    }

    function finishRace() {
      raceFinished = true;
      carState.speed = 0;

      const seconds = ((Date.now() - raceStartTime) / 1000).toFixed(1);

      document.getElementById("finishScreen").style.display = "grid";
      document.getElementById("finishMessage").textContent =
        "You completed " + activeLaps + " lap" + (activeLaps === 1 ? "!" : "s!");

      document.getElementById("finishTime").textContent =
        "Your time: " + seconds + " seconds";
    }

    // =====================================
    // TRACK DISTANCE / WALL SYSTEM
    // =====================================
    function closestPointOnTrack(x, z) {
      let bestDistance = Infinity;
      let bestPoint = { x: 0, z: 0 };

      const points = activeTrack.points;

      for (let i = 0; i < points.length; i++) {
        const a = points[i];
        const b = points[(i + 1) % points.length];

        const result = closestPointOnLineSegment(x, z, a[0], a[1], b[0], b[1]);

        if (result.distance < bestDistance) {
          bestDistance = result.distance;
          bestPoint = { x: result.x, z: result.z };
        }
      }

      return bestPoint;
    }

    function distanceToTrack(x, z) {
      let bestDistance = Infinity;
      const points = activeTrack.points;

      for (let i = 0; i < points.length; i++) {
        const a = points[i];
        const b = points[(i + 1) % points.length];

        const result = closestPointOnLineSegment(x, z, a[0], a[1], b[0], b[1]);

        if (result.distance < bestDistance) {
          bestDistance = result.distance;
        }
      }

      return bestDistance;
    }

    function closestPointOnLineSegment(px, pz, ax, az, bx, bz) {
      const abx = bx - ax;
      const abz = bz - az;

      const apx = px - ax;
      const apz = pz - az;

      const lengthSquared = abx * abx + abz * abz;

      let t = (apx * abx + apz * abz) / lengthSquared;
      t = Math.max(0, Math.min(1, t));

      const x = ax + abx * t;
      const z = az + abz * t;

      const dx = px - x;
      const dz = pz - z;

      return {
        x: x,
        z: z,
        distance: Math.sqrt(dx * dx + dz * dz)
      };
    }

    // =====================================
    // COUNTDOWN / GAME LOOP
    // =====================================
    let previousTime = 0;

    function animate(time = 0) {
      requestAnimationFrame(animate);

      const delta = Math.min((time - previousTime) / 1000, 0.05);
      previousTime = time;
updateCountdown();
updateCar(delta);
updateHud();
moveRemoteCars();

// Send your position 10 times each second.
// Sending every single frame would be too much.
carUpdateTimer += delta;

if (carUpdateTimer >= 0.1) {
  carUpdateTimer = 0;
  sendCarPosition();
}

renderer.render(scene, camera);
    }

    function updateCountdown() {
      const countdown = document.getElementById("countdown");
      const millisecondsLeft = raceStartTime - Date.now();

      if (millisecondsLeft > 3000) {
        countdown.textContent = "3";
      } else if (millisecondsLeft > 2000) {
        countdown.textContent = "2";
      } else if (millisecondsLeft > 1000) {
        countdown.textContent = "1";
      } else if (millisecondsLeft > 0) {
        countdown.textContent = "GO!";
      } else {
        countdown.textContent = "";
      }
    }

    function updateHud() {
      const shownLap = Math.min(carState.lap, activeLaps);

      document.getElementById("lapText").textContent =
        "Lap: " + shownLap + " / " + activeLaps;

      document.getElementById("speedText").textContent =
        "Speed: " + Math.round(Math.abs(carState.speed) * 10);
    }

    function resizeGame() {
      if (!renderer || !camera) return;

      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
